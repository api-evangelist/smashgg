name: Smashgg
description: >-
  Smashgg (now start.gg, following its acquisition by Microsoft) is a
  competitive-gaming and esports platform for running tournaments, brackets, and
  leagues across fighting games and other titles. Its public developer API is a
  single GraphQL endpoint (https://api.start.gg/gql/alpha) exposing tournaments,
  events, entrants, sets, phases, standings, players, and users, plus mutations
  for reporting set results and managing seeding and brackets. Authentication is
  via personal access tokens (Bearer, 1-year expiry) or OAuth 2.0
  authorization-code tokens scoped to a user. The original smash.gg domain now
  redirects to start.gg.
